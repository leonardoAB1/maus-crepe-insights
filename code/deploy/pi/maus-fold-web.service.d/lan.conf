# Example drop-in: serve the review website on port 80 of every IPv4
# interface. Copy to /etc/systemd/system/maus-fold-web.service.d/lan.conf.
#
# WARNING: this serves private videos and run data with no authentication
# or encryption. Use only on a trusted network with the data owner's
# explicit authorization. Never forward the port to the internet.
#
# The paths are the same examples as in maus-fold-web.service. The empty
# ExecStart= clears the base command before replacing it.

[Service]
ExecStart=
ExecStart=/home/raspi/.local/bin/pixi run -e pi detect \
    --data-dir /home/raspi/maus-fold-runtime/data --host 0.0.0.0 --port 80
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
