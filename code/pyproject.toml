[project]
name = "maus-export"
version = "0.1.0"
description = "Export Maus Robotics crêpe runs from the dashboard to raw JSON, ROS 2 MCAP and analysis tables"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "httpx>=0.27",
    "mcap>=1.2",
    "mcap-ros2-support>=0.5",
    "pandas>=2.2",
    "pyarrow>=16",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Models: train with anything, but ship/serve them as ONNX (see code/models/README.md)
ml = [
    "scikit-learn>=1.5",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "skl2onnx>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[project.scripts]
maus-export = "maus_export.cli:main"
maus-docs = "docsync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maus_export", "docsync"]

# --- pixi -------------------------------------------------------------------
# Environment manager for the team. Conda-forge first, PyPI only for packages
# that are not on conda-forge (mcp, mcap, mcap-ros2-support).

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.12.*"
pandas = ">=2.2"
pyarrow = ">=16"
httpx = ">=0.27"
tzdata = "*"
opencv = ">=5.0.0,<6"
matplotlib = ">=3.11.2,<4"

[tool.pixi.pypi-dependencies]
maus-export = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8"
ruff = ">=0.6"

[tool.pixi.feature.ml.dependencies]
scikit-learn = ">=1.5"
onnx = ">=1.17"
onnxruntime = ">=1.20"
skl2onnx = ">=1.18"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
ml = { features = ["ml", "dev"], solve-group = "default" }

[tool.pixi.tasks]
export = "maus-export"
fetch = "maus-export fetch"
mcap = "maus-export mcap"
table = "maus-export table"
vision = "maus-export vision"
example = "maus-export example"
docs = "maus-docs"
docs-check = "maus-docs --check"
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
