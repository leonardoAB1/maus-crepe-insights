[project]
name = "maus-export"
version = "0.1.0"
description = "Export Maus Robotics crêpe runs from the dashboard to raw JSON, ROS 2 MCAP and analysis tables"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "httpx>=0.27",
    "mcap>=1.2",
    "mcap-ros2-support>=0.5",
    "pandas>=2.2",
    "pyarrow>=16",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Models: train with anything, but ship/serve them as ONNX (see code/models/README.md)
ml = [
    "scikit-learn>=1.5",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "skl2onnx>=1.18",
    "torch>=2.14",
    "torchvision>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[project.scripts]
maus-export = "maus_export.cli:main"
maus-docs = "docsync:main"
maus-classify = "maus_classify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maus_export", "maus_classify", "docsync"]

# --- pixi -------------------------------------------------------------------
# Environment manager for the team. Conda-forge first, PyPI only for packages
# that are not on conda-forge (mcp, mcap, mcap-ros2-support).

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64", "linux-aarch64"]

[tool.pixi.dependencies]
python = "3.12.*"
pandas = ">=2.2"
pyarrow = ">=16"
httpx = ">=0.27"
tzdata = "*"
opencv = ">=5.0.0,<6"
matplotlib = ">=3.11.2,<4"

[tool.pixi.pypi-dependencies]
maus-export = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8"
ruff = ">=0.6"

[tool.pixi.feature.ml.dependencies]
scikit-learn = ">=1.5"
onnx = ">=1.17"
onnxruntime = ">=1.20"
skl2onnx = ">=1.18"
jupyterlab = ">=4.6.5,<5"
pytorch-cpu = ">=2.14.1,<3"
torchvision = ">=0.29.2,<0.30"
statsmodels = ">=0.15.0,<0.16"

[tool.pixi.feature.ml.tasks]
analyze = "maus-export analyze"
doe-analyze = "maus-export doe-analyze"
doe-figures = "maus-export doe-figures"
embed = "maus-export embed"
fold-student = "maus-export fold-student"
fold-student-eval = "maus-export fold-student-eval"
fold-student-human = "maus-export fold-student-human"
fold-student-pose = "maus-export fold-student-pose"
fold-class = "maus-classify fold-class"
fold-class-example = "maus-classify fold-class-example"
model-examples = "maus-classify model-examples"
robustness = "maus-classify robustness"
robustness-example = "maus-classify robustness-example"
fold-crosscheck = "maus-classify fold-crosscheck"
notebook = "jupyter lab notebooks"

[tool.pixi.feature.pi.dependencies]
python = "3.12.*"
numpy = ">=2"
py-opencv = { version = ">=5.0.0,<6", build = "*headless*" }
matplotlib-base = ">=3.11.2,<4"

[tool.pixi.feature.pi.activation.env]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"

[tool.pixi.feature.pi.tasks]
detect = "python -m maus_export.experimental_fold.fold_pi"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default", platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"] }
ml = { features = ["ml", "dev"], solve-group = "default", platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"] }
pi = { features = ["pi"], no-default-feature = true, platforms = ["linux-aarch64"] }

[tool.pixi.tasks]
export = "maus-export"
fetch = "maus-export fetch"
mcap = "maus-export mcap"
table = "maus-export table"
vision = "maus-export vision"
overlay-pose = "maus-export overlay-pose"
example = "maus-export example"
frames = "maus-classify frames"
fold-experimental-frames = "maus-export fold-experimental-frames"
fold-experimental-segment = "maus-export fold-experimental-segment"
fold-experimental-eval = "maus-export fold-experimental-eval"
fold-experimental-live = "maus-export fold-experimental-live"
fold-watch = "maus-export fold-watch"
fold-live-eval = "maus-export fold-live-eval"
fold-batch = "maus-export fold-batch"
fold-review = "maus-export fold-review"
fold-experimental-dashboard = "maus-export fold-experimental-dashboard"
coverage = "maus-classify coverage"
fold-frames = "maus-export fold-frames"
fold-segment = "maus-export fold-segment"
fold-eval = "maus-export fold-eval"
fold-live = "maus-export fold-live"
fold-dashboard = "maus-export fold-dashboard"
doe = "maus-export doe-design"
estimate-correction = "python -m maus_export.robot_correction_estimate"
apply-correction = "python -m maus_export.robot_correction_apply"
review-correction = "python -m maus_export.robot_correction_review"
pixel-masks = "python -m maus_export.pixel_masks"
pixel-mask-tasks = "python -m maus_export.pixel_mask_tasks"
mask-assist = "python -m maus_export.mask_assist"
docs = "maus-docs"
docs-check = "maus-docs --check"
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
