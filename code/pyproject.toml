[project]
name = "maus-export"
version = "0.1.0"
description = "Export Maus Robotics crêpe runs from the dashboard to raw JSON, ROS 2 MCAP and analysis tables"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "httpx>=0.27",
    "mcap>=1.2",
    "mcap-ros2-support>=0.5",
    "pandas>=2.2",
    "pyarrow>=16",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Models: train with anything, but ship/serve them as ONNX (see code/models/README.md)
ml = [
    "scikit-learn>=1.5",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "skl2onnx>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[project.scripts]
maus-export = "maus_export.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maus_export"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
