[workspace]
name = "maus-phase-labeling"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
ffmpeg = "==7.1.1"
pytest = ">=8,<9"

[pypi-dependencies]
label-studio = "==1.23.2"

[tasks]
prepare = "python ../maus_export/phase_pilot.py"
start = "python workflow.py start"
setup = "python workflow.py setup"
export-masks = "python mask_export.py"
label-sets = "python collaboration.py"
label-set = "python collaboration.py start"
prefill-pixels = "python pixel_predictions.py"
test = { cmd = "python -m pytest ../tests/test_labeling_workflow.py ../tests/test_phase_pilot.py ../tests/test_mask_labeling.py ../tests/test_labeling_sets.py ../tests/test_pixel_prefill.py -q", env = { PYTHONPATH = ".." } }
