<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crepe run viewer</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fdf6ea;
    --panel: #fffbf2;
    --line: #efe1ca;
    --ink: #3b3229;
    --ink-soft: #8a7a63;
    --caramel: #e39b3d;
    --material: #7fbf6a;
    --hole: #e8705f;
    --shadow: 0 1px 2px rgba(150,120,80,.07), 0 10px 26px rgba(150,120,80,.10);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 16px/1.4 ui-rounded, "Quicksand", "Segoe UI", system-ui, sans-serif;
  }
  .app { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }

  .bar {
    display: flex; align-items: center; gap: 20px;
    padding: 12px 22px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700;
           font-size: 19px; white-space: nowrap; }
  .mark { width: 26px; height: 26px; border-radius: 50%; background: #fdeec9;
          border: 3px dashed var(--caramel); }
  .legend { display: flex; gap: 14px; overflow: hidden; color: var(--ink-soft);
            font-size: 15px; }
  .legend span { display: flex; gap: 7px; align-items: center; white-space: nowrap; }
  .swatch { width: 13px; height: 13px; border-radius: 4px; display: inline-block; }
  .clock { margin-left: auto; display: flex; align-items: baseline; gap: 8px;
           font-family: var(--mono); white-space: nowrap; }
  .clock b { font-size: 24px; font-weight: 600; }
  .clock span { color: var(--ink-soft); font-size: 16px; }

  .viewport { position: relative; display: grid; place-items: center;
              padding: 12px 22px; min-height: 0; }
  .wrap { position: relative; line-height: 0; }
  video { max-width: 100%; max-height: 100%; display: block; border-radius: 16px;
          box-shadow: var(--shadow); background: #f6ecd9; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%;
           pointer-events: none; border-radius: 16px; }
  .wrap::before, .wrap::after {
    content: ""; position: absolute; width: 22px; height: 22px;
    border: 3px solid var(--caramel); pointer-events: none;
  }
  .wrap::before { top: -8px; left: -8px; border-right: 0; border-bottom: 0;
                  border-radius: 10px 0 0 0; }
  .wrap::after { bottom: -8px; right: -8px; border-left: 0; border-top: 0;
                 border-radius: 0 0 10px 0; }
  .toast {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    background: #fff4dd; border: 1px solid var(--line); color: #a86a1e;
    padding: 6px 14px; border-radius: 999px; font-size: 15px; max-width: 70vw;
  }
  .toast:empty { display: none; }

  .deck {
    display: flex; align-items: center; gap: 20px;
    padding: 12px 22px 14px; background: var(--panel);
    border-top: 1px solid var(--line);
  }
  .track { flex: 1 1 auto; min-width: 180px; }
  #spark { display: block; height: 26px; width: 100%; }
  #timeline {
    position: relative; height: 26px; margin-top: 6px; background: #fbf3e2;
    border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
    overflow: hidden;
  }
  #timeline .seg { position: absolute; top: 5px; bottom: 5px; border-radius: 3px; }
  #timeline .playhead {
    position: absolute; top: 2px; bottom: 2px; width: 3px;
    background: var(--ink); border-radius: 3px; opacity: .65;
  }
  .cells { display: flex; align-items: center; gap: 22px; flex: none; }
  .cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .cell b { font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
            color: var(--caramel); font-weight: 700; }
  .cell span { font-family: var(--mono); font-size: 19px; white-space: nowrap;
               max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  .cell.state span { font-family: inherit; font-weight: 700; font-size: 20px; }
  .ctl { display: flex; align-items: center; gap: 14px; flex: none;
         border-left: 1px solid var(--line); padding-left: 20px; }
  select {
    background: #fffbf2; color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 10px; font: inherit; font-family: var(--mono);
  }
  label { display: flex; gap: 7px; align-items: center; font-size: 15px;
          white-space: nowrap; color: var(--ink-soft); }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Crepe run viewer</div>
    <div class="legend" id="legend"></div>
    <div class="clock"><b id="frame">0</b><span id="of">/ 0</span></div>
  </header>

  <section class="viewport">
    <div class="toast" id="toast"></div>
    <div class="wrap">
      <video id="video" controls preload="metadata" muted></video>
      <canvas id="overlay"></canvas>
    </div>
  </section>

  <footer class="deck">
    <div class="track">
      <svg id="spark"></svg>
      <div id="timeline" title="Fold states across the clip; click to jump"></div>
    </div>
    <div class="cells">
      <div class="cell state">
        <b>state</b>
        <span><i class="dot" id="state_dot"></i> <span id="state">-</span></span>
      </div>
      <div class="cell"><b>model</b><span id="prediction_state">-</span></div>
      <div class="cell" title="0 is a match, higher is worse">
        <b>deviation</b><span id="deviation">-</span>
      </div>
      <div class="cell"><b>check</b><span id="check">-</span></div>
      <div class="cell"><b>recorded</b><span id="verdict">-</span></div>
    </div>
    <div class="ctl">
      <select id="producer" title="which producer answers"></select>
      <label><input type="checkbox" id="show_material" checked>material</label>
      <label><input type="checkbox" id="show_holes" checked>holes</label>
    </div>
  </footer>
</div>

<script>
const STATE_COLOURS = {
  emptyplate: '#c9b79b', flat: '#7ca9d6', cooking: '#f2b33d',
  halffold: '#7fbf6a', 'quarter fold': '#a98bd8', ugly: '#e8705f'
};
const NO_STATE_COLOUR = '#f0e6d3';
const MATERIAL_RGB = '127,191,106';
const HOLE_RGB = '232,112,95';
const TINT_ALPHA = 0.40;
const POLL_MS = 300;
const REVIEW_THRESHOLD = 0.5;

const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const el = (id) => document.getElementById(id);
const els = {
  frame: el('frame'), of: el('of'), state: el('state'), state_dot: el('state_dot'),
  prediction_state: el('prediction_state'), deviation: el('deviation'),
  check: el('check'), verdict: el('verdict'), producer: el('producer'),
  legend: el('legend'), timeline: el('timeline'), spark: el('spark'),
  toast: el('toast'), show_material: el('show_material'),
  show_holes: el('show_holes')
};

let status = null;
let cache = new Map();
let maskCache = new Map();
let lastKey = null;

async function boot() {
  status = await (await fetch('/api/status')).json();
  els.of.textContent = `/ ${status.frames}`;
  video.src = '/api/video';
  els.legend.innerHTML = Object.entries(STATE_COLOURS).map(([name, colour]) =>
    `<span><i class="swatch" style="background:${colour}"></i>${name}</span>`
  ).join('') + '<span><i class="swatch" style="background:rgb(127,191,106)">'
    + '</i>material</span><span><i class="swatch" style="background:'
    + 'rgb(232,112,95)"></i>holes</span>';
  for (const producer of status.producers) {
    const option = document.createElement('option');
    option.value = producer.name;
    option.textContent = producer.name;
    option.title = producer.describes;
    if (producer.name === status.producer) option.selected = true;
    els.producer.appendChild(option);
  }
  const records = (await (await fetch('/api/records')).json()).records || [];
  drawTimeline(records);
  drawSpark(records);
  video.addEventListener('seeked', () => refresh(true));
  video.addEventListener('pause', () => refresh(true));
  video.addEventListener('timeupdate', () => refresh());
  els.producer.addEventListener('change', () => { cache.clear(); refresh(true); });
  for (const id of ['show_material', 'show_holes']) {
    el(id).addEventListener('change', () => refresh(true));
  }
  els.timeline.addEventListener('click', (event) => {
    const ratio = event.offsetX / els.timeline.clientWidth;
    video.currentTime = ratio * (status.frames / status.fps);
  });
  setInterval(() => { if (!video.paused) refresh(); }, POLL_MS);
  refresh(true);
}

function drawTimeline(records) {
  els.timeline.innerHTML = '';
  if (!records.length || !status.frames) return;
  const width = Math.max(1.5, (8 / status.frames) * 100);
  for (const record of records) {
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.style.left = `${(record.frame / status.frames) * 100}%`;
    seg.style.width = `${width}%`;
    seg.style.background = STATE_COLOURS[record.state] || NO_STATE_COLOUR;
    seg.title = `frame ${record.frame}: ${record.state || 'no state'}`;
    els.timeline.appendChild(seg);
  }
  const head = document.createElement('div');
  head.className = 'playhead';
  head.id = 'playhead';
  els.timeline.appendChild(head);
}

function drawSpark(records) {
  const points = records
    .map((record) => [record.frame, record.deviation])
    .filter(([, value]) => value !== null && value !== undefined)
    .sort((a, b) => a[0] - b[0]);
  const width = 1200, height = 26, pad = 2;
  els.spark.setAttribute('viewBox', `0 0 ${width} ${height}`);
  els.spark.setAttribute('preserveAspectRatio', 'none');
  if (points.length < 2) { els.spark.innerHTML = ''; return; }
  const maxFrame = Math.max(status.frames - 1, 1);
  const x = (frame) => pad + (frame / maxFrame) * (width - pad * 2);
  const y = (value) => height - pad - value * (height - pad * 2);
  const line = points.map(([frame, value], index) =>
    `${index ? 'L' : 'M'} ${x(frame).toFixed(1)} ${y(value).toFixed(1)}`).join(' ');
  const area = `${line} L ${x(points[points.length - 1][0]).toFixed(1)} `
    + `${height - pad} L ${x(points[0][0]).toFixed(1)} ${height - pad} Z`;
  els.spark.innerHTML =
    `<line x1="0" y1="${y(REVIEW_THRESHOLD)}" x2="${width}" `
    + `y2="${y(REVIEW_THRESHOLD)}" stroke="#e8705f" stroke-dasharray="6 6" `
    + `stroke-width="1"/>`
    + `<path d="${area}" fill="rgba(227,155,61,.22)"/>`
    + `<path d="${line}" fill="none" stroke="#e39b3d" stroke-width="2"/>`
    + `<line id="spark_marker" x1="0" y1="0" x2="0" y2="${height}" `
    + `stroke="#3b3229" stroke-width="2" opacity=".6"/>`;
  els.spark.dataset.x = JSON.stringify({ pad, width, maxFrame });
  moveMarker(currentFrame());
}

function moveMarker(frame) {
  const marker = document.getElementById('spark_marker');
  if (!marker || !els.spark.dataset.x) return;
  const { pad, width, maxFrame } = JSON.parse(els.spark.dataset.x);
  const x = pad + (frame / maxFrame) * (width - pad * 2);
  marker.setAttribute('x1', x);
  marker.setAttribute('x2', x);
}

function currentFrame() {
  if (!status) return 0;
  return Math.min(status.frames - 1,
    Math.max(0, Math.round(video.currentTime * status.fps)));
}

async function layersFor(frame, producer) {
  const key = `${producer}:${frame}`;
  if (cache.has(key)) return cache.get(key);
  const response = await fetch(
    `/api/frame/${frame}?producer=${encodeURIComponent(producer)}`);
  const payload = await response.json();
  cache.set(key, payload);
  if (cache.size > 400) cache.clear();
  return payload;
}

async function maskImage(source) {
  if (!maskCache.has(source)) {
    const image = new Image();
    const loaded = new Promise((resolve) => { image.onload = resolve; });
    image.src = source;
    maskCache.set(source, loaded.then(() => image));
    if (maskCache.size > 200) maskCache.clear();
  }
  return maskCache.get(source);
}

async function refresh(force = false) {
  if (!status) return;
  const frame = currentFrame();
  const producer = els.producer.value || status.producer;
  const key = `${producer}:${frame}`;
  if (!force && key === lastKey) return;
  lastKey = key;
  const payload = await layersFor(frame, producer);
  const playhead = document.getElementById('playhead');
  if (playhead) playhead.style.left = `${(frame / status.frames) * 100}%`;
  moveMarker(frame);
  els.frame.textContent = frame;
  els.toast.textContent = payload.error
    || (payload.notes || []).join(' ');
  const state = payload.state || 'unknown';
  els.state.textContent = state;
  els.state_dot.style.background = STATE_COLOURS[state] || NO_STATE_COLOUR;
  els.prediction_state.textContent = payload.prediction_state || 'none';
  els.deviation.textContent = payload.deviation === null
    || payload.deviation === undefined ? '-' : payload.deviation.toFixed(2);
  els.check.textContent = payload.check || '-';
  els.verdict.textContent = payload.verdict || '-';
  els.check.title = payload.phase_context
    ? `phases, not aligned to frames: ${payload.phase_context}` : '';
  await draw(payload);
}

async function draw(payload) {
  const width = video.videoWidth || status.width;
  const height = video.videoHeight || status.height;
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const masks = payload.masks || {};
  if (els.show_material.checked && masks.material) {
    await tint(masks.material, MATERIAL_RGB);
  }
  if (els.show_holes.checked && masks.holes) {
    await tint(masks.holes, HOLE_RGB);
  }
}

async function tint(source, rgb) {
  const image = await maskImage(source);
  const off = document.createElement('canvas');
  off.width = canvas.width;
  off.height = canvas.height;
  const offCtx = off.getContext('2d');
  offCtx.drawImage(image, 0, 0, canvas.width, canvas.height);
  offCtx.globalCompositeOperation = 'source-in';
  offCtx.fillStyle = `rgba(${rgb},${TINT_ALPHA})`;
  offCtx.fillRect(0, 0, off.width, off.height);
  ctx.drawImage(off, 0, 0);
}

boot().catch((error) => { els.toast.textContent = String(error); });
</script>
</body>
</html>
