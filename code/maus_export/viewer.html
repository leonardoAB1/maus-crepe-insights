<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crepe run viewer</title>
<style>
  :root {
    color-scheme: light;
    --bg: #faf5ea;
    --bg-2: #f4ecdd;
    --card: #fffdf7;
    --line: #e9dfcb;
    --ink: #453b33;
    --ink-soft: #8d7f6d;
    --caramel: #c98f4f;
    --batter: #f0dcb4;
    --material: #8fb37c;
    --hole: #d4887a;
    --shadow: 0 1px 2px rgba(122,103,79,.06), 0 10px 24px rgba(122,103,79,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 ui-rounded, "Quicksand", "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; gap: 16px; align-items: center;
    padding: 20px 30px; background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .logo {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--batter); border: 3px dashed var(--caramel);
  }
  h1 { font-size: 22px; margin: 0; font-weight: 700; }
  .meta { color: var(--ink-soft); font-size: 15px; }
  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 380px;
    gap: 24px; padding: 24px 30px 34px; align-items: start;
  }
  .stage {
    position: relative; border-radius: 20px; overflow: hidden;
    border: 1px solid var(--line); background: var(--bg-2);
    box-shadow: var(--shadow); line-height: 0;
  }
  video, canvas { width: 100%; height: auto; display: block; }
  canvas { position: absolute; inset: 0; pointer-events: none; }
  .label {
    color: var(--ink-soft); font-size: 15px; margin: 16px 0 8px;
  }
  #timeline {
    position: relative; height: 40px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px;
    cursor: pointer; overflow: hidden; box-shadow: var(--shadow);
  }
  #timeline .seg { position: absolute; top: 8px; bottom: 8px; border-radius: 5px; }
  #timeline .playhead {
    position: absolute; top: 4px; bottom: 4px; width: 3px;
    background: var(--caramel); border-radius: 3px;
  }
  aside { display: flex; flex-direction: column; gap: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 22px; box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 14px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--caramel); margin: 0 0 16px; font-weight: 700;
  }
  .state {
    display: flex; align-items: center; gap: 12px;
    font-size: 32px; font-weight: 700; line-height: 1.2;
  }
  .dot { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
  .rows { margin-top: 20px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .row span:first-child { color: var(--ink-soft); font-size: 16px; }
  .row span:last-child { font-size: 21px; font-weight: 650; text-align: right; }
  .note { color: var(--ink-soft); font-size: 15px; margin: 18px 0 0; }
  select, button {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; font: inherit; max-width: 100%;
  }
  label { display: flex; gap: 8px; align-items: center; font-size: 16px; }
  .row-toggles { display: flex; gap: 18px; margin-top: 16px; flex-wrap: wrap; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .legend {
    display: flex; gap: 18px; flex-wrap: wrap; font-size: 16px;
    color: var(--ink-soft); margin-top: 16px;
  }
  .legend span { display: flex; gap: 8px; align-items: center; }
  svg text { fill: var(--ink-soft); font-size: 13px; }
  footer { padding: 0 30px 34px; color: var(--ink-soft); font-size: 15px; }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true"></div>
  <div>
    <h1>Crepe run viewer</h1>
    <div class="meta" id="meta">loading</div>
  </div>
</header>

<main>
  <div>
    <div class="stage">
      <video id="video" controls preload="metadata" muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <p class="label">Fold states in this clip. Click to jump.</p>
    <div id="timeline"></div>
  </div>

  <aside>
    <div class="card">
      <h2>Right now</h2>
      <div class="state">
        <i class="dot" id="state_dot"></i><span id="state">-</span>
      </div>
      <div class="rows">
        <div class="row"><span>model says</span><span id="prediction_state">-</span></div>
        <div class="row"><span>deviation</span><span id="deviation">-</span></div>
        <div class="row"><span>check</span><span id="check">-</span></div>
        <div class="row"><span>recorded</span><span id="verdict">-</span></div>
      </div>
      <p class="note" id="phase_context"></p>
      <p class="note" id="notes"></p>
      <p class="note" id="error"></p>
    </div>

    <div class="card">
      <h2>States in this clip</h2>
      <div id="donut"></div>
      <div class="legend" id="donut_legend"></div>
    </div>

    <div class="card">
      <h2>Layers</h2>
      <label>what answers
        <select id="producer"></select>
      </label>
      <div class="row-toggles">
        <label><input type="checkbox" id="show_material" checked> material</label>
        <label><input type="checkbox" id="show_holes" checked> holes</label>
      </div>
      <p class="note" id="producer_note"></p>
    </div>
  </aside>
</main>

<footer>
  Local only. Masks and video stay in the private data directory, nothing is
  uploaded, and a suggestion is drawn, not verified.
</footer>

<script>
const STATE_COLOURS = {
  emptyplate: '#c3b49f', flat: '#9fbfe0', cooking: '#e2bb6c',
  halffold: '#a8c795', 'quarter fold': '#c8aede', ugly: '#d99a8d'
};
const NO_STATE_COLOUR = '#e9dfcb';
const MATERIAL_RGB = '143,179,124';
const HOLE_RGB = '212,136,122';
const TINT_ALPHA = 0.40;
const POLL_MS = 300;

const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const el = (id) => document.getElementById(id);
const els = {
  meta: el('meta'), state: el('state'), state_dot: el('state_dot'),
  prediction_state: el('prediction_state'), deviation: el('deviation'),
  check: el('check'), verdict: el('verdict'), phase_context: el('phase_context'),
  notes: el('notes'), error: el('error'), producer: el('producer'),
  producer_note: el('producer_note'), timeline: el('timeline'),
  donut: el('donut'), donut_legend: el('donut_legend'),
  show_material: el('show_material'), show_holes: el('show_holes')
};

let status = null;
let cache = new Map();
let maskCache = new Map();
let lastKey = null;

async function boot() {
  status = await (await fetch('/api/status')).json();
  els.meta.textContent =
    `${status.video} - ${status.frames} frames - ${status.records} records`;
  video.src = '/api/video';
  for (const producer of status.producers) {
    const option = document.createElement('option');
    option.value = producer.name;
    option.textContent = producer.name;
    if (producer.name === status.producer) option.selected = true;
    els.producer.appendChild(option);
  }
  const records = (await (await fetch('/api/records')).json()).records || [];
  drawTimeline(records);
  drawDonut(records);
  video.addEventListener('seeked', () => refresh(true));
  video.addEventListener('pause', () => refresh(true));
  video.addEventListener('timeupdate', () => refresh());
  els.producer.addEventListener('change', () => { cache.clear(); refresh(true); });
  for (const id of ['show_material', 'show_holes']) {
    el(id).addEventListener('change', () => refresh(true));
  }
  els.timeline.addEventListener('click', (event) => {
    const ratio = event.offsetX / els.timeline.clientWidth;
    video.currentTime = ratio * (status.frames / status.fps);
  });
  setInterval(() => { if (!video.paused) refresh(); }, POLL_MS);
  refresh(true);
}

function drawTimeline(records) {
  els.timeline.innerHTML = '';
  if (!records.length || !status.frames) return;
  const width = Math.max(2, (8 / status.frames) * 100);
  for (const record of records) {
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.style.left = `${(record.frame / status.frames) * 100}%`;
    seg.style.width = `${width}%`;
    seg.style.background = STATE_COLOURS[record.state] || NO_STATE_COLOUR;
    els.timeline.appendChild(seg);
  }
  const head = document.createElement('div');
  head.className = 'playhead';
  head.id = 'playhead';
  els.timeline.appendChild(head);
}

function drawDonut(records) {
  const counts = new Map();
  for (const record of records) {
    if (!record.state) continue;
    counts.set(record.state, (counts.get(record.state) || 0) + 1);
  }
  const entries = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((sum, [, value]) => sum + value, 0);
  if (!total) {
    els.donut.innerHTML = '<p class="note">no labelled frames in this clip</p>';
    return;
  }
  const size = 230, radius = 88, thickness = 30, centre = size / 2;
  let angle = -Math.PI / 2, arcs = '';
  for (const [name, value] of entries) {
    const sweep = (value / total) * Math.PI * 2;
    const end = angle + sweep;
    const large = sweep > Math.PI ? 1 : 0;
    const x1 = centre + radius * Math.cos(angle);
    const y1 = centre + radius * Math.sin(angle);
    const x2 = centre + radius * Math.cos(end);
    const y2 = centre + radius * Math.sin(end);
    arcs += `<path d="M ${x1} ${y1} A ${radius} ${radius} 0 ${large} 1 `
      + `${x2} ${y2}" stroke="${STATE_COLOURS[name] || NO_STATE_COLOUR}"`
      + ` stroke-width="${thickness}" fill="none" stroke-linecap="butt"/>`;
    angle = end;
  }
  els.donut.innerHTML =
    `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`
    + arcs
    + `<text x="${centre}" y="${centre + 10}" text-anchor="middle"`
    + ` style="font-size:30px;fill:var(--ink)">${total}</text>`
    + `</svg>`;
  els.donut_legend.innerHTML = entries.map(([name, value]) =>
    `<span><i class="swatch" style="background:${STATE_COLOURS[name] || NO_STATE_COLOUR}"></i>`
    + `${name} ${Math.round((value / total) * 100)}%</span>`).join('');
}

function currentFrame() {
  if (!status) return 0;
  return Math.min(status.frames - 1,
    Math.max(0, Math.round(video.currentTime * status.fps)));
}

async function layersFor(frame, producer) {
  const key = `${producer}:${frame}`;
  if (cache.has(key)) return cache.get(key);
  const response = await fetch(
    `/api/frame/${frame}?producer=${encodeURIComponent(producer)}`);
  const payload = await response.json();
  cache.set(key, payload);
  if (cache.size > 400) cache.clear();
  return payload;
}

async function maskImage(source) {
  if (!maskCache.has(source)) {
    const image = new Image();
    const loaded = new Promise((resolve) => { image.onload = resolve; });
    image.src = source;
    maskCache.set(source, loaded.then(() => image));
    if (maskCache.size > 200) maskCache.clear();
  }
  return maskCache.get(source);
}

async function refresh(force = false) {
  if (!status) return;
  const frame = currentFrame();
  const producer = els.producer.value || status.producer;
  const key = `${producer}:${frame}`;
  if (!force && key === lastKey) return;
  lastKey = key;
  const payload = await layersFor(frame, producer);
  const playhead = document.getElementById('playhead');
  if (playhead) playhead.style.left = `${(frame / status.frames) * 100}%`;
  els.error.textContent = payload.error || '';
  const state = payload.state || 'unknown';
  els.state.textContent = state;
  els.state_dot.style.background = STATE_COLOURS[state] || NO_STATE_COLOUR;
  els.prediction_state.textContent = payload.prediction_state || 'none';
  els.deviation.textContent = payload.deviation === null
    || payload.deviation === undefined ? '-' : payload.deviation.toFixed(2);
  els.check.textContent = payload.check || '-';
  els.verdict.textContent = payload.verdict || '-';
  els.phase_context.textContent = payload.phase_context
    ? `phases, not aligned to frames: ${payload.phase_context}` : '';
  els.notes.textContent = (payload.notes || []).join(' ');
  els.producer_note.textContent = payload.error ? '' :
    (status.producers.find((p) => p.name === producer)?.describes || '');
  await draw(payload);
}

async function draw(payload) {
  const width = video.videoWidth || status.width;
  const height = video.videoHeight || status.height;
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const masks = payload.masks || {};
  if (els.show_material.checked && masks.material) {
    await tint(masks.material, MATERIAL_RGB);
  }
  if (els.show_holes.checked && masks.holes) {
    await tint(masks.holes, HOLE_RGB);
  }
}

async function tint(source, rgb) {
  const image = await maskImage(source);
  const off = document.createElement('canvas');
  off.width = canvas.width;
  off.height = canvas.height;
  const offCtx = off.getContext('2d');
  offCtx.drawImage(image, 0, 0, canvas.width, canvas.height);
  offCtx.globalCompositeOperation = 'source-in';
  offCtx.fillStyle = `rgba(${rgb},${TINT_ALPHA})`;
  offCtx.fillRect(0, 0, off.width, off.height);
  ctx.drawImage(off, 0, 0);
}

boot().catch((error) => { els.error.textContent = String(error); });
</script>
</body>
</html>
