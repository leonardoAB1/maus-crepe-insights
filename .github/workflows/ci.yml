# Runs lint, format check and tests on every pull request and on main after
# each merge. docs-sync dispatches it after pushing a sync commit, since pushes
# made with the workflow token do not trigger other workflows. Uses the ml
# environment because tests/test_analysis.py needs scikit-learn.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: code/pyproject.toml
          environments: ml
          cache: true

      - name: Lint
        run: pixi run -e ml lint

      - name: Check formatting
        run: pixi run -e ml fmt-check

      - name: Test
        run: pixi run -e ml test

  labeling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: code/labeling/pixi.toml
          cache: true

      - name: Test labeling integration
        run: pixi run --locked --manifest-path labeling/pixi.toml test
