# Runs lint, format check and tests on every pull request. Uses the ml
# environment because tests/test_analysis.py needs scikit-learn.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: code/pyproject.toml
          environments: ml
          cache: true

      - name: Lint
        run: pixi run -e ml ruff check .

      - name: Check formatting
        run: pixi run -e ml ruff format --check .

      - name: Test
        run: pixi run -e ml pytest
